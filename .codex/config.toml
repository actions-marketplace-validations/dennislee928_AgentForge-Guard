# Generated by `afg agents sync codex` from agentforge.yaml.
# Codex reads this file only for trusted projects. Codex's own sandbox is
# defense in depth; `afg run` enforces the agentforge policy.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = false

[shell_environment_policy]
# Pass only core variables, and drop names containing KEY, SECRET or TOKEN.
inherit = "core"
ignore_default_excludes = false
