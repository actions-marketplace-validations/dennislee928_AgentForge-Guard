[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["examples", "tests", "fuzz"]

[workspace.package]
version = "1.0.0-rc.3"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

repository = "https://github.com/dennislee928/AgentForge-Guard"
keywords = ["ai-agents", "sandbox", "policy", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
afg-core = { path = "crates/afg-core", version = "=1.0.0-rc.3" }
afg-detect = { path = "crates/afg-detect", version = "=1.0.0-rc.3" }
afg-executor = { path = "crates/afg-executor", version = "=1.0.0-rc.3" }
afg-report = { path = "crates/afg-report", version = "=1.0.0-rc.3" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Smaller, faster release binaries. They ship to users (and npm), so size counts:
# drop the symbol table (debuginfo is already stripped by default), and optimise
# across crates. panic stays "unwind" so Drop-based cleanup (sandbox containers,
# process groups) still runs if a panic ever happens.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
