[package]
name = "afg-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
afg-core = { path = "../afg-core" }
base64 = "0.23.1"
hmac = "0.13.0"
ignore = "0.4.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "io-util", "rt", "macros", "sync", "io-std"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["process"] }
