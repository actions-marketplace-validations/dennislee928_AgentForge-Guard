[package]
name = "afg-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
afg-core = { version = "0.1.0-alpha.0", path = "../afg-core" }
ignore = "0.4.30"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "io-util", "rt", "macros", "sync", "io-std"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["process"] }
