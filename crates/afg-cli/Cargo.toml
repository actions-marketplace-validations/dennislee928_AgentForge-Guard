[package]
name = "afg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "afg"
path = "src/main.rs"

[dependencies]
afg-core = { path = "../afg-core" }
afg-detect = { path = "../afg-detect" }
afg-executor = { path = "../afg-executor" }
afg-report = { path = "../afg-report" }
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
