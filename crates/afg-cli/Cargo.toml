[package]
name = "agentforge-guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "AgentForge Guard (afg): a policy-driven execution guard for AI coding agents"

[lints]
workspace = true

[[bin]]
name = "afg"
path = "src/main.rs"

[dependencies]
afg-core = { workspace = true }
afg-detect = { workspace = true }
afg-executor = { workspace = true }
afg-report = { workspace = true }
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
getrandom = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time"] }
toml = "1.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
base64 = "0.23.1"
predicates = "3.1.4"
tar = "0.4.46"
tempfile = "3.27.0"
